name: Contact configuration checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/check-contact-build.test.mjs
      - run: pnpm check
      - run: pnpm build
        env:
          PUBLIC_CONTACT_WEBHOOK_URL: https://core.japs.ing/api/publico/contacto/
      - run: node scripts/check-contact-build.mjs
      - run: pnpm seo:audit
