name: Contact configuration checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/check-contact-build.test.mjs
      - run: pnpm check
      - run: pnpm build
        env:
          PUBLIC_CONTACT_WEBHOOK_URL: https://n8n.gestion.japs.ing/webhook/contacto-japs
          PUBLIC_TURNSTILE_SITE_KEY: test-public-site-key
      - run: node scripts/check-contact-build.mjs
      - run: pnpm seo:audit
